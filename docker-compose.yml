services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voxadesk_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - voxadesk_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  voxadesk_postgres:
